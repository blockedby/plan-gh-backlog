[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-gh-backlog"
version = "1.0.0"
description = "Validate, schedule, and safely publish deterministic Markdown backlogs to GitHub"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "blockedby"}]
keywords = ["agent-skill", "github", "backlog", "roadmap", "issues"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/blockedby/plan-gh-backlog"
Repository = "https://github.com/blockedby/plan-gh-backlog"
Issues = "https://github.com/blockedby/plan-gh-backlog/issues"

[project.scripts]
plan-gh-backlog = "plan_gh_backlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
